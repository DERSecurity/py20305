site_name: py20305
site_description: An open IEEE 2030.5 / CSIP client for distributed energy resources
repo_url: https://github.com/DERSecurity/py20305
edit_uri: edit/main/docs/

theme:
  name: material
  # The cream mark reads on the teal header in both palettes; the charcoal
  # one is for browser tabs, which are usually light.
  logo: assets/satori-mark-dark.png
  favicon: assets/satori-mark.png
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            heading_level: 3
            members_order: source
            docstring_style: google
            separate_signature: true
            show_signature_annotations: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - toc:
      permalink: true

# Feature plans live in the repository for whoever picks the work up next.
# They are not product documentation, so they stay out of the site.
exclude_docs: |
  planning/

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Running a client: running.md
  - Guides:
      - Finding servers: discovery.md
      - Connecting devices: connectors.md
      - Management API: api.md
      - Forwarding traffic: forwarding.md
      - Running in a container: docker.md
      - Testing: testing.md
  - Reference:
      - Client: reference/client.md
      - Events: reference/events.md
      - Telemetry: reference/telemetry.md
      - Connectors: reference/connectors.md
      - Forwarders: reference/forwarders.md
