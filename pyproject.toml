[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "py20305"
version = "0.2.0"
description = "An open IEEE 2030.5 / CSIP client for distributed energy resources"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
keywords = ["ieee2030.5", "csip", "csip-aus", "der", "sunspec", "modbus", "smart-grid"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
]

# The protocol client itself: HTTP over mTLS, the generated IEEE 2030.5
# bindings, and the XML serialization they need. Everything past that is an
# extra, so a consumer embedding only the client does not pull in a web
# framework or an MQTT library.
dependencies = [
    "aiohttp>=3.9",
    "cryptography>=42.0",
    "pydantic>=2.6",
    "xsdata-pydantic>=24.0",
    "lxml>=5.0",
]

[project.scripts]
py20305 = "py20305.cli:main"

[project.optional-dependencies]
# The management API. Optional because a consumer embedding the client in its
# own service usually mounts the router in an app it already has.
api = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
# Running the client from a configuration file. PyYAML is what makes the
# config a .yaml rather than a .json; the runner itself needs nothing else.
cli = [
    "pyyaml>=6.0",
]
# The SunSpec Modbus connector, for talking to a real device.
sunspec = [
    "pysunspec2>=1.3.5",
    "pyserial>=3.5",
]
# Publishing captured protocol exchanges to a monitoring system over MQTT.
mqtt = [
    "aiomqtt>=2.0",
]
all = ["py20305[api,cli,sunspec,mqtt]"]
# Building the documentation site. mkdocstrings reads the package's own
# docstrings, so the docs build also proves the public API imports.
docs = [
    # Capped below 2.0 deliberately. MkDocs 2.0 removes the plugin system and
    # the theming system with no migration path, which would take mkdocstrings
    # and Material with it. Revisit once that ecosystem has settled.
    "mkdocs>=1.6,<2.0",
    "mkdocs-material>=9.5,<10",
    "mkdocstrings[python]>=0.26",
]
dev = [
    "py20305[all,docs]",
    "ruff>=0.4,<0.16",
    "mypy>=1.9",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-aiohttp>=1.1",
    "httpx>=0.27",
    "lxml-stubs>=0.5",
    "import-linter>=2.0",
    "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
py20305 = ["schemas/*.xsd", "connectors/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
# Type-checking targets the published API. Tests assert behavior rather than
# publish one, so they are not checked and `files` says so rather than leaving
# a bare `mypy` to fail on 1400 unannotated fixtures.
files = ["src/py20305"]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Generated from the published IEEE 2030.5 and CSIP-AUS schemas; not
# hand-maintained, so it is not held to the same annotation standard.
module = "py20305.models.*"
disallow_untyped_defs = false


[tool.pytest.ini_options]
# tests/e2e needs a live IEEE 2030.5 server and is excluded from the default
# run; its own fixtures skip it when none is configured, but not collecting it
# keeps `pytest` fast and offline by default. Run it with `pytest tests/e2e`.
testpaths = ["tests"]
addopts = "--ignore=tests/e2e"
asyncio_mode = "auto"
markers = [
    "e2e: requires a live IEEE 2030.5 server (see scripts/e2e_server.py)",
]
