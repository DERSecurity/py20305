# A production client configuration.
#
# Paths are resolved relative to this file, so the deployment can be moved
# without rewriting them.
#
# Validate it without connecting:
#     py20305 --config client.yaml --check
#
# A log file needs a writable directory. The shipped systemd unit creates
# /var/log/py20305 via LogsDirectory and makes nothing else writable, so a
# path outside it fails to open and the client exits. The journal and
# `docker logs` collect stderr either way.

server:
  # Omit this to have the client locate a server on the local network by
  # DNS-SD query at startup, which is what IEEE 2030.5 6.9.2 asks a client to
  # do. A utility server reached over the internet will never answer such a
  # query -- multicast does not cross a router -- so name it here for that
  # case, which is also what CSIP expects.
  url: https://server.example.com:8443

  # Standard servers publish DeviceCapability at /dcap. Override only if told to.
  # dcap_path: /dcap

  # Which IEEE 2030.5 schemas the server speaks. Inbound, the client reads any
  # element either edition defines. Outbound, it sends only what the base
  # edition defines plus the listed features and extensions.
  # schema:
  #   # auto reads the DeviceCapability: schemaVer "2.2" or higher means 2023,
  #   # anything else (including no schemaVer) means 2018. The decision and its
  #   # evidence are logged. Or set 2018 or 2023.
  #   base: auto
  #   # Functions a server borrows from another edition. Never detected.
  #   # import_export_limits: opModMaxLimWAbsorb / opModMaxLimWInject (2023)
  #   # on a 2018 server, with DERControlType2 bits 7 and 8 in modesSupported2,
  #   # modesEnabled2 and modesResponded2.
  #   features: []
  #   # Schemas in other namespaces: csip-aus-1.2, csip-aus-1.3. auto detects
  #   # them from the namespaces the server declares.
  #   extensions: auto

  # Accept a subscription the server created without a Location header, under
  # a synthetic URI. Both editions require the header on 201 Created, so this
  # is a workaround for a non-conforming server.
  # missing_location_fallback: false

  # Deprecated: true is schema.base: 2018 plus missing_location_fallback: true.
  # server_2018_compat: false

  # Poll once immediately after connecting rather than waiting for the first
  # scheduled cycle.
  # poll_now_on_start: true

  # Follow the server's Time resource for scheduling rather than the local
  # clock. The local clock is never modified either way.
  # use_server_time: true

  # How old an FSA's own Time observation may get before scheduling for its
  # programs falls back to the global timebase. Unset derives it from the Time
  # poll cadence (three polls, at least an hour), which is what a healthy
  # deployment wants; set it only to override that.
  # fsa_stale_seconds: 3600

# Locating a server on the local network. Only used when server.url above is
# not set; a configured URL is an equally valid answer under 7.6 a).
# discovery:
#   enabled: true
#
#   # mdns is the transport IEEE 2030.5-2023 makes normative (.local domain).
#   # xmdns is the 2018 transport (.site, site-local ff05::fb) and is
#   # deprecated. `both` queries each in turn.
#   transport: mdns
#
#   timeout_seconds: 3.0
#
#   # Retrying a query that found nothing follows the `connection` block
#   # below, the same as retrying a connection that failed.
#
#   # Ask about one function set instead, using a 7.5 Table 17 subtype string.
#   # Unset asks for this client's own EndDevice first, then for any server.
#   # subtype: derp
#
#   # Which interface to query from on a multi-homed host: an address for
#   # IPv4, an interface name for IPv6.
#   # interface: 192.168.1.10

# Announcing this client on the local network, so an inventory tool or a
# commissioning laptop on the same segment can find it. Off by default, and
# outside IEEE 2030.5: the standard has servers advertise and clients query.
# The records carry this client's LFDI and SFDI, so anything on the segment
# can inventory clients by their utility identity.
# advertise:
#   transport: mdns          # mdns | xmdns | both | off
#
#   # Deliberately not _smartenergy._tcp: this is not an IEEE 2030.5 server,
#   # and claiming that name would make conformant clients try to read a
#   # DeviceCapability resource it does not serve.
#   service: _py20305._tcp
#
#   # The port to advertise. Unset names the management API when enabled,
#   # otherwise the notification server, and announces nothing when neither is.
#   # port: 8080

tls:
  # The LFDI derived from this certificate is what the utility registers.
  # `--check` prints it.
  client_cert: certs/client.pem
  client_key: certs/client.key
  ca_cert: certs/ca.pem

  # Leave on unless the server is reached by an address its certificate does
  # not name. Turning it off accepts a certificate issued for any other host
  # that chains to the same CA.
  # check_hostname: true

  # IEEE 2030.5 mandates ECDSA-only suites. A peer fronted by enterprise PKI
  # may present an RSA certificate and need one added. Each entry must name
  # exactly one TLS 1.2 suite.
  # additional_ciphers:
  #   - ECDHE-RSA-AES256-GCM-SHA384

devices:
  # Needs no hardware: logs the controls it would have applied. Useful for
  # bringing up a server connection before an inverter is wired in.
  - type: print_demo
    lfdi: "0000000000000000000000000000000000000000"

  # A device driven by your own connector: a BaseConnector subclass, imported
  # by path and constructed with init_kwargs.
  # - type: custom
  #   lfdi: "1111111111111111111111111111111111111111"
  #   class_path: myproject.connectors.MyInverter
  #   init_kwargs:
  #     host: 192.168.1.50

  # A meter takes no controls and gets no DER resources. role: site_meter is
  # the meter at the premises point of delivery (roleFlags 0x03, import
  # positive); der_meter is a meter on one DER's circuit (roleFlags 0x49, the
  # DER's output positive). The lfdi names the meter and seeds its mRIDs; it
  # needs no certificate. Its connector reports power in that role's frame.
  # - type: custom
  #   lfdi: "2222222222222222222222222222222222222222"
  #   class_path: myproject.connectors.MyMeter
  #   role: site_meter
  #   revenue_quality: false   # true adds isRevenueQuality (0x10) to roleFlags
  #   # site_meter only: site posts under this client's own EndDevice, own
  #   # under the lfdi above.
  #   mirror_under: site

logging:
  level: INFO
  # file: /var/log/py20305/client.log

# Unauthenticated: bound to loopback unless you have a reason otherwise.
api:
  enabled: false
  host: 127.0.0.1
  port: 8080

# A client on a gateway outlives the server's outages, so it retries the
# initial connection indefinitely by default.
connection:
  retry_forever: true
  initial_delay_seconds: 5
  max_delay_seconds: 300

  # Multiplier applied to the delay after each failed attempt, up to
  # max_delay_seconds.
  # backoff_factor: 2.0

  # Give up after this many attempts instead of retrying forever. 0 means
  # never give up, and is only meaningful with retry_forever: true.
  # max_attempts: 0

# Register an EndDevice for this client's certificate identity if the server
# does not already have one. Registering when it does would create a duplicate,
# so this is safe to leave on across restarts.
# register_on_start: true

# Subscribe to server resources instead of relying on polling alone. The
# listener binds notification_host:notification_port; notification_external_host
# is the address the SERVER delivers to, and is required -- it becomes each
# subscription's notificationURI.
#
# subscription:
#   enabled: true
#   notification_external_host: my-hostname.example.com
#   notification_port: 10443
#   renewal_method: post        # or put (PUT to the subscription's own href)
#   backstop_poll_seconds: 900  # never faster than the resource's pollRate

# Read each configured device on a schedule and report it upstream: readings
# mirrored as MirrorUsagePoints, and DERCapability, DERSettings, DERStatus and
# DERAvailability PUT for the device.
#
# On by default. The rates below are the defaults; the server's
# EndDevice.postRate overrides post_rate_seconds when it specifies one.
#
# telemetry:
#   enabled: true
#   post_rate_seconds: 300
#   der_capability_poll_rate_seconds: 86400
#   der_settings_poll_rate_seconds: 60
#   der_resource_put_policy: periodic   # or on_change (once, then on change)
#   reading_profile: default   # or signed_load_convention, or signed_as_reported
#   power_direction: default   # or net, or split (default profile only)

# The operations history: events, device writes, and measured intervals, in one
# SQLite file. On by default. site_intervals keeps a site meter's readings as a
# series of their own, import positive, beside the devices' intervals.
#
# history:
#   enabled: true
#   path: py20305-history.sqlite3
#   intervals:
#     enabled: true
#   site_intervals:
#     enabled: true
